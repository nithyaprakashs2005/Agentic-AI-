[project]
name = "support-voice-worker"
version = "0.1.0"
description = "Pipecat voice pipeline worker for the support agent"
requires-python = ">=3.13,<3.15"

# Deliberately a SEPARATE environment from ../backend.
#
# pipecat-ai and litellm require incompatible `openai` majors, so they cannot
# share a virtualenv. The API owns LiteLLM; this worker owns Pipecat. See
# ../docs/DEVIATIONS.md section 2.
dependencies = [
    "pipecat-ai[groq,livekit,silero]==1.7.0",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.1.1",
    "httpx==0.28.1",
]

[project.optional-dependencies]
# Kokoro-82M (Apache 2.0) runs locally; the ONNX build avoids a torch install.
kokoro = ["kokoro-onnx>=0.4.9"]

[dependency-groups]
dev = ["ruff==0.14.2"]

[tool.ruff]
line-length = 100
target-version = "py313"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]
