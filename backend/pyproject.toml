[project]
name = "support-agent-backend"
version = "0.1.0"
description = "Multi-channel AI customer support platform - LangGraph orchestrator + FastAPI"
# system specification targets Python 3.14; only 3.14.0a4 (alpha) is available via uv today,
# which breaks binary wheels for pydantic-core/numpy. Pinned to stable 3.13 until
# 3.14 reaches a final release. See docs/DEVIATIONS.md.
requires-python = ">=3.13,<3.15"

dependencies = [
    # --- Web layer ---
    "fastapi==0.141.1",
    "uvicorn[standard]==0.40.0",
    "python-multipart>=0.0.26",
    "websockets==15.0.1",
    # --- Config & validation ---
    "pydantic==2.13.1",
    "pydantic-settings==2.15.0",
    # --- Agent orchestration ---
    "langgraph==1.2.11",
    "langchain-core==1.6.0",
    # --- Model gateway (Groq -> Gemini -> Ollama) ---
    "litellm==1.97.0",
    # --- Misc ---
    "httpx==0.28.1",
    "tenacity==9.1.2",
]

[project.optional-dependencies]
# Installed only when the corresponding backing service is available.
# The app degrades gracefully to in-process fallbacks when these are absent.
qdrant = ["qdrant-client==1.19.0"]
redis = ["redis==6.4.0"]
postgres = [
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary,pool]>=3.2.10",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
]
embeddings = ["sentence-transformers==5.1.1"]
deep = ["deepagents==0.7.8"]
mcp = ["fastmcp==3.4.7"]
voice = ["pipecat-ai==1.7.0", "silero-vad>=5.1"]
# v2 SDK: matches the v2 server, which needs only PostgreSQL.
observability = ["langfuse>=2.60,<3"]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "pytest-cov==7.0.0",
    "pytest-timeout==2.4.0",
    "ruff==0.14.2",
    "mypy==1.18.2",
    "anyio==4.11.0",
    # Migrations are exercised against SQLite in CI; Postgres needs Docker.
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "aiosqlite>=0.20.0",
    "asgi-lifespan>=2.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "T20", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
# scripts/ are CLIs: stdout is their interface.
"scripts/**" = ["T20"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.report]
fail_under = 80
omit = ["*/tests/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
